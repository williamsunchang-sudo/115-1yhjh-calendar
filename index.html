<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#fdf4e9;
  --card:#fffdf9;
  --ink:#3b332c;
  --ink-soft:#7a6c5f;
  --line:#ece0cf;
  --mango:#e8940c;
  --mango-soft:#fbe6c2;
  --lake:#3a8a7a;
  --lake-soft:#d9ece6;
  --berry:#c9455c;
  --berry-soft:#fadfe3;
  --plum:#7b5ea7;
  --plum-soft:#e9e2f5;
  --shadow:0 2px 0 rgba(120,96,70,.10);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#221d19;
    --card:#2c2621;
    --ink:#f2e9df;
    --ink-soft:#b7a898;
    --line:#413830;
    --mango:#f2ad3e;
    --mango-soft:#4a3a20;
    --lake:#6fc0ae;
    --lake-soft:#1f3b35;
    --berry:#ef8a9b;
    --berry-soft:#43242a;
    --plum:#b79ede;
    --plum-soft:#332a45;
    --shadow:0 2px 0 rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#221d19; --card:#2c2621; --ink:#f2e9df; --ink-soft:#b7a898; --line:#413830;
  --mango:#f2ad3e; --mango-soft:#4a3a20; --lake:#6fc0ae; --lake-soft:#1f3b35;
  --berry:#ef8a9b; --berry-soft:#43242a; --plum:#b79ede; --plum-soft:#332a45;
  --shadow:0 2px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px; line-height:1.7;
}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 72px}
a{color:inherit}

/* ---------- 開頭 ---------- */
header{padding:34px 0 6px;position:relative}
.hi{font-family:"LXGW WenKai TC",serif;font-size:15px;color:var(--lake);margin:0 0 6px}
h1{
  font-family:"LXGW WenKai TC",serif;font-weight:700;
  font-size:clamp(28px,6.4vw,42px);line-height:1.25;margin:0 0 8px;letter-spacing:.02em;
}
.sub{margin:0;color:var(--ink-soft);font-size:15px}

/* ---------- 今天 / 下一件事 ---------- */
.today{
  margin:22px 0 6px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);
  display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
}
.today .dot{
  width:46px;height:46px;border-radius:50%;background:var(--mango-soft);
  display:grid;place-items:center;font-size:22px;flex:none;
}
.today h2{font-family:"LXGW WenKai TC",serif;font-size:19px;margin:0 0 2px;font-weight:700}
.today p{margin:0;color:var(--ink-soft);font-size:14.5px}
.today .body{flex:1 1 220px;min-width:0}
.today ul{margin:8px 0 0;padding-left:18px}
.today li{font-size:15px}

/* ---------- 搜尋與篩選 ---------- */
.tools{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 8px;margin-top:18px}
.search{position:relative}
.search input{
  width:100%;padding:13px 16px 13px 44px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:16px;box-shadow:var(--shadow);
}
.search input:focus{outline:2.5px solid var(--lake);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5}

.filter-toggle{
  display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:9px 14px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;
}
.filter-toggle b{font-weight:700}
.filter-toggle .chev{margin-left:auto;transition:transform .15s;opacity:.6}
.filter-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.filter-toggle:focus-visible{outline:2.5px solid var(--lake);outline-offset:2px}

.filters{max-height:0;overflow:hidden;transition:max-height .2s ease}
.filters.open{max-height:400px}
.filters-inner{padding-top:4px}

.rowlabel{font-size:12.5px;color:var(--ink-soft);margin:12px 0 6px}
.chips{
  display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:2px;margin:0 -18px;padding-left:18px;padding-right:18px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  padding:7px 14px;border-radius:999px;font-family:inherit;font-size:14.5px;
  cursor:pointer;transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.chip:hover{border-color:var(--mango)}
.chip:focus-visible{outline:2.5px solid var(--lake);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--mango);border-color:var(--mango);color:#fff;font-weight:500}
:root[data-theme="dark"] .chip[aria-pressed="true"],
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#2a2118}
.count{margin:10px 0 0;font-size:14px;color:var(--ink-soft)}
.count b{color:var(--ink);font-weight:700}

/* ---------- 月份 ---------- */
.month{margin:34px 0 0}
.month > h3{
  font-family:"LXGW WenKai TC",serif;font-size:22px;margin:0 0 2px;font-weight:700;
  display:flex;align-items:baseline;gap:10px;
}
.month > h3 span{font-family:"Noto Sans TC",sans-serif;font-size:13px;color:var(--ink-soft);font-weight:400}
.month .rule{height:3px;background:var(--mango-soft);border-radius:2px;margin:6px 0 16px}

/* ---------- 活動卡 ---------- */
.ev{
  display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
}
.ev.big{border-color:var(--mango);background:linear-gradient(0deg,var(--mango-soft),var(--card) 60%)}
.ev.past{opacity:.5}
.ev.now{border-color:var(--lake);border-width:2px}
.date{flex:none;width:58px;text-align:center;line-height:1.15}
.date .d{font-family:"LXGW WenKai TC",serif;font-size:26px;font-weight:700}
.date .m{font-size:12px;color:var(--ink-soft)}
.date .w{
  display:inline-block;margin-top:5px;font-size:11.5px;padding:1px 7px;border-radius:999px;
  background:var(--lake-soft);color:var(--lake);
}
.date .w.we{background:var(--berry-soft);color:var(--berry)}
.ev .main{flex:1 1 auto;min-width:0}
.ev .t{font-size:16px;font-weight:500;margin:0 0 3px;word-break:break-word}
.ev .meta{font-size:13.5px;color:var(--ink-soft);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--lake-soft);color:var(--lake)}
.tag.g7{background:var(--mango-soft);color:var(--mango)}
.tag.all{background:var(--berry-soft);color:var(--berry)}
.tag.fam{background:var(--plum-soft);color:var(--plum)}
.tag.dept{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.star{color:var(--mango);flex:none;font-size:15px}

.empty{
  text-align:center;padding:48px 20px;color:var(--ink-soft);
  background:var(--card);border:1px dashed var(--line);border-radius:20px;margin-top:24px;
}
.empty .face{font-size:34px;display:block;margin-bottom:8px}
.empty button{margin-top:12px}

/* ---------- 頁尾 ---------- */
.notes{
  margin-top:40px;background:var(--lake-soft);border-radius:20px;padding:20px 22px;
}
.notes h4{font-family:"LXGW WenKai TC",serif;margin:0 0 8px;font-size:18px}
.notes ul{margin:0;padding-left:20px}
.notes li{font-size:15px;margin-bottom:4px}
footer{margin-top:28px;font-size:13px;color:var(--ink-soft);text-align:center;line-height:1.9}
.theme-btn{
  position:absolute;top:34px;right:0;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px;
}
.theme-btn:focus-visible{outline:2.5px solid var(--lake);outline-offset:2px}
@media (max-width:480px){
  .date{width:50px}
  .date .d{font-size:23px}
  .today{padding:16px}
}
@media print{.tools,.theme-btn{display:none}}
</style>
</head>

<footer>

</footer>

const WHO = ["全部","七年級","八年級","九年級","家長","教師"];
const KIND = ["全部","教務處","學務處","輔導處","總務處"];
const MONTHS = ["全部","8 月","9 月","10 月","11 月","12 月","1 月"];
const MKEY = {"8 月":"2026-08","9 月":"2026-09","10 月":"2026-10","11 月":"2026-11","12 月":"2026-12","1 月":"2027-01"};
const WD = ["日","一","二","三","四","五","六"];
const TODAY = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

let state = {who:"七年級", kind:"全部", when:"全部", q:""};

function parse(s){const a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function fmtRange(ev){
  const a=parse(ev.d);
  let s=`${a.getMonth()+1}/${a.getDate()}（${WD[a.getDay()]}）`;
  if(ev.e&&ev.e!==ev.d){const b=parse(ev.e);s+=` – ${b.getMonth()+1}/${b.getDate()}（${WD[b.getDay()]}）`;}
  return s;
}
function matchWho(ev){
  if(state.who==="全部")return true;
  if(state.who==="教師")return ev.g.includes("教師");
  if(state.who==="家長")return ev.g.includes("家長")||ev.g.includes("全校");
  return ev.g.includes(state.who)||ev.g.includes("全校");
}
function filtered(){
  const q=state.q.trim().toLowerCase();
  return E.filter(ev=>{
    if(!matchWho(ev))return false;
    if(state.kind!=="全部"&&ev.p!==state.kind)return false;
    if(state.when!=="全部"&&!ev.d.startsWith(MKEY[state.when]))return false;
    if(q&&!((ev.t+" "+(ev.n||"")+" "+ev.p+" "+ev.g.join("")).toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
function tagCls(g){
  if(g==="全校")return "tag all";
  if(g==="家長")return "tag fam";
  if(g==="七年級")return "tag g7";
  return "tag";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function card(ev){
  const a=parse(ev.d), end=parse(ev.e||ev.d);
  const past=end<TODAY, now=a<=TODAY&&TODAY<=end;
  const cls=["ev",ev.s?"big":"",past?"past":"",now?"now":""].filter(Boolean).join(" ");
  const we=(a.getDay()===0||a.getDay()===6)?" we":"";
  const tags=ev.g.map(g=>`<span class="${tagCls(g)}">${g}</span>`).join("")+`<span class="tag dept">${ev.p}</span>`;
  const meta=[fmtRange(ev),ev.n||""].filter(Boolean).join("　");
  return `<article class="${cls}">
    <div class="date"><div class="d">${a.getDate()}</div><div class="m">${a.getMonth()+1} 月</div><div class="w${we}">${WD[a.getDay()]}</div></div>
    <div class="main"><p class="t">${esc(ev.t)}</p><p class="meta">${esc(meta)}</p><div class="tags">${tags}</div></div>
    ${ev.s?'<div class="star" title="重要活動">★</div>':''}
  </article>`;
}

function render(){
  const list=filtered();
  document.getElementById("count").innerHTML = list.length
    ? `符合的活動共 <b>${list.length}</b> 件`
    : "";
  const box=document.getElementById("list");
  if(!list.length){
    box.innerHTML=`<div class="empty"><span class="face">🍵</span>這個條件下沒有活動，換個關鍵字或類別再找找看。<br><button class="chip" id="reset">回到全部活動</button></div>`;
    document.getElementById("reset").onclick=()=>{state={who:"全部",kind:"全部",when:"全部",q:""};document.getElementById("q").value="";buildChips();render();};
    return;
  }
  let html="",cur="";
  list.forEach(ev=>{
    const k=ev.d.slice(0,7);
    if(k!==cur){
      if(cur)html+="</div>";
      cur=k;
      const y=+k.slice(0,4),m=+k.slice(5,7);
      html+=`<section class="month"><h3>${m} 月<span>${y} 年</span></h3><div class="rule"></div><div>`;
    }
    html+=card(ev);
  });
  html+="</div></section>";
  box.innerHTML=html;
}

function chipRow(id,items,key){
  const el=document.getElementById(id);
  el.innerHTML=items.map(v=>`<button class="chip" aria-pressed="${state[key]===v}">${v}</button>`).join("");
  el.querySelectorAll(".chip").forEach((b,i)=>b.onclick=()=>{state[key]=items[i];buildChips();render();});
}
function updateSummary(){
  document.getElementById("filterSummary").textContent =
    `篩選：${state.who} · ${state.kind==="全部"?"全部類別":state.kind} · ${state.when==="全部"?"全部時間":state.when}`;
}
function buildChips(){chipRow("who",WHO,"who");chipRow("kind",KIND,"kind");chipRow("when",MONTHS,"when");updateSummary();}

const fToggle=document.getElementById("filterToggle");
const fPanel=document.getElementById("filterPanel");
fToggle.onclick=()=>{
  const open=fPanel.classList.toggle("open");
  fToggle.setAttribute("aria-expanded",open?"true":"false");
};

function todayBox(){
  const y=TODAY.getFullYear(),m=TODAY.getMonth()+1,d=TODAY.getDate();
  const todayStr=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const on=E.filter(ev=>parse(ev.d)<=TODAY&&TODAY<=parse(ev.e||ev.d));
  const next=E.filter(ev=>ev.s&&parse(ev.d)>TODAY).sort((a,b)=>a.d<b.d?-1:1)[0];
  let body=`<h2>今天是 ${m} 月 ${d} 日（${WD[TODAY.getDay()]}）</h2>`;
  if(on.length){
    body+=`<p>正在進行中的活動：</p><ul>${on.slice(0,5).map(e=>`<li>${esc(e.t)}</li>`).join("")}</ul>`;
  }else{
    body+=`<p>今天沒有特別的全校活動，安心上課。</p>`;
  }
  if(next){
    const nd=parse(next.d);
    const days=Math.round((nd-TODAY)/86400000);
    body+=`<p style="margin-top:8px">下一個大日子：<strong>${esc(next.t)}</strong>，${nd.getMonth()+1}/${nd.getDate()}，還有 ${days} 天。</p>`;
  }
  document.getElementById("todayBox").innerHTML=`<div class="dot">🌱</div><div class="body">${body}</div>`;
}

document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});
const tb=document.getElementById("themeBtn");
tb.onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
  tb.textContent=isDark?"☾":"☀";
  try{localStorage.setItem("yhjh-theme",isDark?"light":"dark");}catch(err){}
};
try{
  const saved=localStorage.getItem("yhjh-theme");
  if(saved){document.documentElement.setAttribute("data-theme",saved);tb.textContent=saved==="dark"?"☀":"☾";}
}catch(err){}

todayBox();buildChips();render();
</script>
</body>
</html>
